function renderHonigRankingView(){
  const wirtschaftsvoelker = DATA.voelker.filter(v=> !(v.ableger && v.ableger.istAbleger));
  if(!wirtschaftsvoelker.length){
    return `
      <div class="topbar">
        <button class="backbtn" id="btn-back-home">‹</button>
        <div><h1 style="font-size:20px;">Honig-Ranking</h1></div>
      </div>
      <div class="empty"><p>Noch keine Wirtschaftsvölker vorhanden.</p></div>
    `;
  }

  const nachVolk = wirtschaftsvoelker
    .map(v=>({volk:v, kg: berechneHonigGesamtVolk(v.id)}))
    .filter(x=>x.kg>0)
    .sort((a,b)=> b.kg-a.kg);

  const nachKoenigin = wirtschaftsvoelker
    .map(v=>({volk:v, kg: berechneHonigSeitKoenigin(v)}))
    .filter(x=>x.kg>0)
    .sort((a,b)=> b.kg-a.kg);

  function rangListe(arr, leerText, kgLabel){
    if(!arr.length) return `<div class="hint">${leerText}</div>`;
    return arr.map((x,i)=>{
      const stand = DATA.staende.find(s=>s.id===x.volk.standId);
      const q = x.volk.koenigin||{};
      return `<div class="mv-card" data-open-volk-ranking="${x.volk.id}">
        <div class="mv-rank">${i+1}</div>
        <div class="mv-info">
          <div class="mv-name">${escapeHtml(x.volk.name)}</div>
          <div class="mv-stand">${stand?escapeHtml(stand.name):''}${q.name?' · Königin: '+escapeHtml(q.name):''}</div>
        </div>
        <div class="mv-score">${x.kg} kg</div>
      </div>`;
    }).join('');
  }

  return `
    <div class="topbar">
      <button class="backbtn" id="btn-back-home">‹</button>
      <div><h1 style="font-size:20px;">Honig-Ranking</h1></div>
    </div>
    <div class="panel">
      <h3>Nach Volk (gesamt über die Jahre)</h3>
      <div class="hint" style="margin:0 0 10px;">Summe aller jemals bei diesem Volk eingetragenen Ernten, unabhängig davon, welche Königin gerade eingesetzt war/ist.</div>
      ${rangListe(nachVolk, 'Noch keine Ernten eingetragen.')}
    </div>
    <div class="panel">
      <h3>Nach aktueller Königin</h3>
      <div class="hint" style="margin:0 0 10px;">Nur der Honig, der seit dem Zusetzen der jeweils aktuell eingesetzten Königin geerntet wurde – relevant für die Zuchtauswahl, da so nur ihr bzw. ihren Nachkommen der Ertrag gutgeschrieben wird.</div>
      ${rangListe(nachKoenigin, 'Noch keine Ernten seit der jeweils aktuellen Königin eingetragen.')}
    </div>
  `;
}

function renderVolkUmzugPanel(volk){
  const stand = DATA.staende.find(s=>s.id===volk.standId);
  if(FORM_OPEN==='volk-umzug'){
    const staende = DATA.staende.filter(s=>s.id!==volk.standId).sort((a,b)=>a.name.localeCompare(b.name,'de'));
    const zielOptions = staende.map(s=>`<option value="${s.id}" ${UMZUG_ZIEL===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('');
    const neuStandInput = UMZUG_ZIEL==='neu' ? `
      <label>Name des neuen Standes</label>
      <input type="text" id="f-vumzug-neuer-stand" placeholder="z. B. Am Waldrand" value="${escapeAttr(DRAFT.standName||'')}">
      <label>Ort</label>
      <input type="text" id="f-vumzug-neuer-stand-ort" placeholder="z. B. Am Waldrand, Musterstadt" value="${escapeAttr(DRAFT.standOrt||'')}">
      <label>Lage</label>
      <select id="f-vumzug-neuer-stand-lage">
        <option value="" ${!DRAFT.standLage?'selected':''}>Keine Angabe</option>
        ${LAGE_OPTIONEN.map(l=>`<option value="${escapeAttr(l)}" ${DRAFT.standLage===l?'selected':''}>${escapeHtml(l)}</option>`).join('')}
      </select>
    ` : '';
    return `<div class="panel">
      <h3>Volk umstellen</h3>
      <label>Neuer Stand</label>
      <select id="f-vumzug-ziel">
        <option value="">Bitte wählen</option>
        ${zielOptions}
        <option value="neu" ${UMZUG_ZIEL==='neu'?'selected':''}>+ Neuen Stand anlegen</option>
      </select>
      ${neuStandInput}
      <div class="formactions">
        <button class="btn btn-ghost" id="btn-cancel-volk-umzug">Abbrechen</button>
        <button class="btn btn-primary" id="btn-save-volk-umzug">Verschieben</button>
      </div>
    </div>`;
  }
  return `<div class="panel">
    <div class="card-row">
      <div>
        <h3 style="margin:0 0 2px;">Standort</h3>
        <div class="hint" style="margin:0;">${stand?escapeHtml(stand.name):'Kein Stand zugeordnet'}</div>
      </div>
      <button class="btn btn-ghost btn-sm" id="btn-open-volk-umzug">Volk umstellen</button>
    </div>
  </div>`;
}

function renderVolkUebersicht(volk){
  const q = volk.koenigin || {};
  const history = volk.koeniginHistory || [];

  let koeniginPanel;
  if(FORM_OPEN==='koenigin' || FORM_OPEN==='koenigin-austausch'){
    const isAustausch = FORM_OPEN==='koenigin-austausch';
    const jahrVal = DRAFT.jahr!==undefined ? DRAFT.jahr : (isAustausch ? new Date().getFullYear() : (q.jahr||''));
    const farbeVal = DRAFT.farbe!==undefined ? DRAFT.farbe : (isAustausch ? '' : (q.farbe||''));
    const nameVal = DRAFT.name!==undefined ? DRAFT.name : (isAustausch ? '' : (q.name||''));
    const herkunftVal = DRAFT.herkunft!==undefined ? DRAFT.herkunft : (isAustausch ? '' : (q.herkunft||''));
    const begattungVal = DRAFT.begattung!==undefined ? DRAFT.begattung : (isAustausch ? '' : (q.begattung||''));
    const nummerVal = DRAFT.nummer!==undefined ? DRAFT.nummer : (isAustausch ? '' : (q.nummer||''));
    koeniginPanel = `<div class="panel">
      <h3>${isAustausch ? 'Neue Königin einsetzen' : 'Königin bearbeiten'}</h3>
      ${isAustausch ? `<div class="hint" style="margin-bottom:6px;">Die bisherige Königin wird mit heutigem Datum in die Königinnen-Historie dieses Volkes übernommen.</div>` : ''}
      <label>Name (optional)</label>
      <input type="text" id="f-q-name" placeholder="z. B. Klara" value="${escapeAttr(nameVal)}">
      <label>Nummer (Zeichenplättchen, optional)</label>
      <input type="text" id="f-q-nummer" placeholder="z. B. 27" value="${escapeAttr(nummerVal)}">
      <div class="row2">
        <div>
          <label>Schlupfjahr</label>
          <input type="number" id="f-q-jahr" value="${escapeAttr(jahrVal)}">
        </div>
        <div>
          <label>Zeichenfarbe</label>
          <input type="text" id="f-q-farbe" placeholder="z. B. Blau" value="${escapeAttr(farbeVal)}">
        </div>
      </div>
      <div class="hint" id="q-farbe-hint">${farbeHintForYear(jahrVal)}</div>
      <label>Herkunft</label>
      <input type="text" id="f-q-herkunft" placeholder="z. B. Eigennachzucht, Zuchtstand XY" value="${escapeAttr(herkunftVal)}">
      <label>Begattungsart</label>
      <select id="f-q-begattung">
        ${begattungsartOptions(begattungVal)}
      </select>
      <div class="formactions">
        <button class="btn btn-ghost" id="btn-cancel-koenigin">Abbrechen</button>
        <button class="btn btn-primary" id="${isAustausch?'btn-save-koenigin-austausch':'btn-save-koenigin'}">Speichern</button>
      </div>
    </div>`;
  } else {
    const historyHtml = history.length ? `<div class="qhistory">
      <div class="qhistory-title">Frühere Königinnen</div>
      ${history.map(h=>`<div class="qhistory-item">${queenBadgeSVG(h,26)}<span><b>${h.name?escapeHtml(h.name):(h.jahr||'–')}</b>${h.name&&h.jahr?' · '+h.jahr:''}${h.farbe?' · '+escapeHtml(h.farbe):''}${h.herkunft?' · '+escapeHtml(h.herkunft):''} — bis ${fmtDate(h.ausgetauschtAm)}</span></div>`).join('')}
    </div>` : '';

    const hatKoenigin = !!(q.name || q.nummer || q.jahr || q.herkunft || q.farbe);
    const qGeneration = q.qId ? koeniginGeneration(q.qId) : 0;
    const stammbaumHtml = hatKoenigin ? `
      <div class="qgen-row">
        <span class="qgen-badge">F${qGeneration}</span>
        <span class="hint" style="margin:0;">${qGeneration===0 ? 'Stammmutter (Ausgangspunkt der Zucht-Verfolgung in dieser App)' : 'Generation '+qGeneration+' – abstammend von einer verfolgten Mutterkönigin'}</span>
      </div>
      <div class="queen-actions">
        <button class="btn btn-ghost btn-sm" id="btn-open-stammbaum" data-qid="${escapeAttr(q.qId||'')}">Stammbaum ansehen</button>
        ${qGeneration>0 ? `<button class="btn btn-ghost btn-sm" id="btn-make-f0">Zu neuer F0 (Stammmutter) machen</button>` : ''}
      </div>
    ` : '';

    koeniginPanel = `<div class="queen-card">
      <div class="qtitle">Königin</div>
      <div class="queen-badge-row" style="margin-top:8px;">
        <div>${queenBadgeSVG(q, 52)}</div>
        <div class="queen-facts">
          <div class="queen-fact"><b>${q.name?escapeHtml(q.name):'–'}</b><span>Name</span></div>
          <div class="queen-fact"><b>${q.nummer?escapeHtml(q.nummer):'–'}</b><span>Nummer</span></div>
          <div class="queen-fact"><b>${q.jahr||'–'}</b><span>Jahr · ${queenAgeLabel(q.jahr)}</span></div>
          <div class="queen-fact"><b>${q.farbe?escapeHtml(q.farbe):'–'}</b><span>Zeichenfarbe</span></div>
          <div class="queen-fact"><b>${q.herkunft?escapeHtml(q.herkunft):'–'}</b><span>Herkunft</span></div>
          <div class="queen-fact"><b>${q.begattung?escapeHtml(q.begattung):'–'}</b><span>Begattungsart</span></div>
        </div>
      </div>
      ${stammbaumHtml}
      <div class="queen-actions">
        <button class="btn btn-ghost btn-sm" id="btn-edit-koenigin">Angaben korrigieren</button>
        <button class="btn btn-primary btn-sm" id="btn-open-koenigin-austausch">Königin austauschen</button>
      </div>
      ${historyHtml}
    </div>`;
  }

  const istWirtschaftsvolk = !volk.ableger || !volk.ableger.istAbleger;
  const honigAnzahl = (volk.beute||{}).honig || 0;
  const honigDaten = RAHMENMASS_DATEN[volk.rahmenmass] || RAHMENMASS_DATEN['Sonstige'];
  const aktuelleSchaetzung = berechneHonigertrag(volk);
  const honigSchaetzung = (istWirtschaftsvolk && honigAnzahl>0) ? `
    <div class="honig-schaetzung">
      <span>Voraussichtlicher Honigertrag</span>
      <b>${aktuelleSchaetzung} kg</b>
    </div>
    <div class="hint">Grobe Schätzung aus Füllstand × ${honigDaten.wabenProZarge} Waben je Zarge × ca. ${honigDaten.kgProWabe} kg je voller Wabe (${escapeHtml(volk.rahmenmass||'Sonstige')}).</div>
  ` : '';

  const ernteButton = (istWirtschaftsvolk && aktuelleSchaetzung>0 && ERNTE_OPEN!==volk.id)
    ? `<button type="button" class="btn btn-secondary btn-block" id="btn-open-ernte" style="margin-top:10px;">🍯 Honig ernten</button>` : '';
  const ernteForm = ERNTE_OPEN===volk.id ? `<div class="panel" style="margin-top:10px;background:#FBF7EC;">
    <h3 style="margin-top:0;">Honig ernten</h3>
    <div class="hint" style="margin:0 0 10px;">Geschätzt waren ${aktuelleSchaetzung} kg im Honigraum. Trage die tatsächlich geerntete Menge ein – beim Speichern werden alle Honigraum-Füllstände dieses Volkes auf 0 zurückgesetzt.</div>
    <label>Tatsächlich geerntete Menge (kg)</label>
    <input type="number" step="0.1" min="0" id="f-ernte-kg" value="${aktuelleSchaetzung}">
    <label>Erntedatum</label>
    <input type="date" id="f-ernte-datum" value="${todayISO()}">
    <label>Notiz (optional)</label>
    <input type="text" id="f-ernte-notiz" placeholder="z. B. Frühtracht, Rapshonig">
    <div class="formactions">
      <button class="btn btn-ghost" id="btn-cancel-ernte">Abbrechen</button>
      <button class="btn btn-primary" id="btn-save-ernte">Ernte eintragen</button>
    </div>
  </div>` : '';
  const honigUebersicht = istWirtschaftsvolk ? `
    <div class="honig-schaetzung" style="margin-top:10px;">
      <span>Geerntet seit aktueller Königin${volk.koenigin&&volk.koenigin.seitAm?' (seit '+fmtDate(volk.koenigin.seitAm)+')':''}</span>
      <b>${berechneHonigSeitKoenigin(volk)} kg</b>
    </div>
    <div class="honig-schaetzung">
      <span>Insgesamt über die Jahre (dieses Volk)</span>
      <b>${berechneHonigGesamtVolk(volk.id)} kg</b>
    </div>
  ` : '';

  const beutePanel = `<div class="panel" id="panel-beute">
    <h3>Beutenaufbau</h3>
    ${beuteVisual(volk, true)}
    <div class="steppers">
      <div class="stepper">
        <div class="stepper-label">Bruträume</div>
        <div class="stepper-controls">
          <button data-beute-type="brut" data-beute-delta="-1">–</button>
          <b>${(volk.beute||{brut:1}).brut}</b>
          <button data-beute-type="brut" data-beute-delta="1">+</button>
        </div>
      </div>
      <div class="stepper">
        <div class="stepper-label">Honigräume</div>
        <div class="stepper-controls">
          <button data-beute-type="honig" data-beute-delta="-1">–</button>
          <b>${(volk.beute||{honig:0}).honig}</b>
          <button data-beute-type="honig" data-beute-delta="1">+</button>
        </div>
      </div>
    </div>
    <div class="row2" style="margin-top:14px;">
      <label class="meilenstein-check">
        <input type="checkbox" id="f-beute-absperrgitter" ${(volk.beute||{}).absperrgitter?'checked':''}>
        <span>Absperrgitter eingesetzt</span>
      </label>
      <label class="meilenstein-check">
        <input type="checkbox" id="f-beute-bienenflucht" ${(volk.beute||{}).bienenflucht?'checked':''}>
        <span>Bienenflucht eingesetzt</span>
      </label>
    </div>
    ${honigSchaetzung}
    ${ernteButton}
    ${ernteForm}
    ${honigUebersicht}
  </div>`;

  const currentHealth = volk.gesundheit || 'unbekannt';
  const healthButtons = `
    <div class="panel">
      <h3>Aktueller Gesundheitszustand</h3>
      <div class="healthbar">
        <button class="healthbtn ${currentHealth==='gut'?'sel-good':''}" data-health="gut">Gut</button>
        <button class="healthbtn ${currentHealth==='beobachten'?'sel-warn':''}" data-health="beobachten">Beobachten</button>
        <button class="healthbtn ${currentHealth==='kritisch'?'sel-bad':''}" data-health="kritisch">Kritisch</button>
      </div>
      <div class="hint">Dieser Status wird auf der Standübersicht angezeigt und lässt sich jederzeit ändern. Details trägst du bei einer Kontrolle ein.</div>
    </div>`;

  const rasse = volk.rasse ? `<div class="hint" style="margin-bottom:14px;">Rasse: <b>${escapeHtml(volk.rasse)}</b></div>` : '';
  const ablegerPanel = renderAblegerDisplay(volk);
  const entwicklungPanel = renderEntwicklungPanel(volk);
  const wirtschaftQuery = renderWirtschaftsvolkQuery(volk);
  const qrPanel = renderVolkQrPanel(volk);
  const umzugPanel = renderVolkUmzugPanel(volk);

  return `<div id="panel-koenigin">${koeniginPanel}</div>${beutePanel}${wirtschaftQuery}<div id="panel-ableger">${ablegerPanel}</div><div id="panel-entwicklung">${entwicklungPanel}</div>${healthButtons}${rasse}${umzugPanel}${qrPanel}
    ${renderAufloesenTrigger()}`;
}

function renderVolkKontrollen(volk, kontrollen){
  const formHtml = FORM_OPEN==='kontrolle' ? renderKontrolleForm() : '';
  let list = '';
  if(kontrollen.length===0 && FORM_OPEN!=='kontrolle'){
    list = `<div class="empty"><p>Noch keine Kontrolle erfasst.</p></div>`;
  } else {
    list = kontrollen.map(k=>{
      return `<div class="entry" id="kontrolle-${k.id}">
        <div class="entry-top">
          <span class="entry-date">${fmtDate(k.datum)}</span>
          ${healthPill(k.gesundheit)}
        </div>
        <div class="ratingchips">
          <div class="ratingchip">Sanftmut${miniHexIcons(k.sanftmut)}</div>
          <div class="ratingchip">Wabensitz${miniHexIcons(k.wabensitz)}</div>
          <div class="ratingchip">Volksstärke${miniHexIcons(k.volksstaerke)}</div>
          <div class="ratingchip">Schwarmneigung${miniHexIcons(k.schwarmneigung)}</div>
          <div class="ratingchip">Varroabelastung${miniHexIcons(k.varroa)}</div>
        </div>
        ${k.brutbild ? `<div class="entry-body">Brutbild: <b>${escapeHtml(k.brutbild)}</b></div>` : ''}
        ${k.notiz ? `<div class="entry-body">${escapeHtml(k.notiz)}</div>` : ''}
        <button class="del" data-del-kontrolle="${k.id}">Löschen</button>
      </div>`;
    }).join('');
  }

  return `${formHtml}
    ${list}
    ${FORM_OPEN!=='kontrolle' ? `<button class="btn btn-primary btn-block" id="btn-new-kontrolle" style="margin-top:10px;">+ Kontrolle erfassen</button>` : ''}`;
}

function renderKontrolleForm(){
  const d = DRAFT;
  if(d.datum===undefined) d.datum = todayISO();
  return `<div class="panel">
    <h3>Neue Kontrolle</h3>
    <label>Datum</label>
    <input type="date" id="f-k-datum" value="${escapeAttr(d.datum)}">

    <label>Sanftmut <span class="hexlegend">(1 = sehr aggressiv, 4 = sehr sanft)</span></label>
    ${hexRatingControl('sanftmut', d.sanftmut||0)}
    ${kritInfoBlock('sanftmut', [
      'stark stechlustig, Bienen fliegen/rennen schon bei leichter Störung an',
      'nervös, einzelne Stiche bei normaler Handhabung',
      'ruhig, reagiert erst bei stärkerer Störung',
      'sehr ruhig, kaum Reaktion auch bei Rähmchenentnahme'
    ])}

    <label>Wabensitz <span class="hexlegend">(1 = unruhig, läuft von der Wabe, 4 = ruhig, sitzt fest)</span></label>
    ${hexRatingControl('wabensitz', d.wabensitz||0)}
    ${kritInfoBlock('wabensitz', [
      'Bienen laufen sofort von der Wabe, viele fliegen auf',
      'einige laufen unruhig, leichtes Auffliegen',
      'größtenteils ruhig sitzend, leichtes Wandern',
      'bleibt ruhig sitzen, kaum Bewegung auch bei Erschütterung'
    ])}

    <label>Volksstärke <span class="hexlegend">(1 = schwach, 4 = sehr stark)</span></label>
    ${hexRatingControl('volksstaerke', d.volksstaerke||0)}
    ${kritInfoBlock('volksstaerke', [
      'wenige besetzte Waben, deutlich unterentwickelt',
      'mittelstark, für die Jahreszeit unterdurchschnittlich',
      'gut entwickelt, altersgemäß besetzt',
      'sehr stark, Volk quillt über, überdurchschnittlich viele Bienen/Brutwaben'
    ])}

    <label>Schwarmneigung <span class="hexlegend">(1 = stark, 4 = keine)</span></label>
    ${hexRatingControl('schwarmneigung', d.schwarmneigung||0)}
    ${kritInfoBlock('schwarmneigung', [
      'mehrere besetzte Schwarmzellen vorhanden, akute Schwarmstimmung',
      'einzelne Spielnäpfchen bzw. Ansätze von Weiselzellen',
      'keine Zellen, aber Anzeichen wie Bautrieb oder Unruhe',
      'keine Anzeichen von Schwarmtrieb'
    ])}

    <label>Varroabelastung <span class="hexlegend">(1 = hoch/Schadschwelle überschritten, 4 = sehr gering)</span></label>
    ${hexRatingControl('varroa', d.varroa||0)}
    ${kritInfoBlock('varroa', [
      'über 10 Milben/Tag – Schadschwelle überschritten, zeitnah behandeln',
      'ca. 6–10 Milben/Tag – erhöht, Behandlung vorbereiten',
      'ca. 2–5 Milben/Tag – gering, weiter beobachten',
      'bis ca. 1 Milbe/Tag – sehr gering, kein Handlungsbedarf'
    ], 'Ermittelt über Gemülldiagnose (Windel 3 Tage einlegen, Milben zählen, durch Tage teilen) oder Puderzuckermethode. Die 10-Milben-Grenze gilt für Spätsommer/Herbst – im Frühsommer (Mai/Juni) liegt die kritische Schwelle mit oft nur 1–3 Milben/Tag deutlich niedriger.')}

    <label>Brutbild (Brutwaben)</label>
    <select id="f-k-brutbild">
      <option value="">Nicht bewertet</option>
      ${BRUTBILD_OPTIONEN.map(o=>`<option value="${escapeAttr(o)}" ${d.brutbild===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
    </select>

    <label>Gesundheitszustand</label>
    <select id="f-k-gesundheit">
      <option value="gut" ${d.gesundheit==='gut'?'selected':''}>Gut</option>
      <option value="beobachten" ${d.gesundheit==='beobachten'?'selected':''}>Beobachten</option>
      <option value="kritisch" ${d.gesundheit==='kritisch'?'selected':''}>Kritisch</option>
    </select>

    <label>Notiz (optional)</label>
    <textarea id="f-k-notiz" placeholder="Brutbild, Futtervorrat, Auffälligkeiten …">${escapeHtml(d.notiz||'')}</textarea>

    <div class="formactions">
      <button class="btn btn-ghost" id="btn-cancel-kontrolle">Abbrechen</button>
      <button class="btn btn-primary" id="btn-save-kontrolle">Speichern</button>
    </div>
  </div>`;
}

function renderVolkBehandlungen(volk, behandlungen){
  const formHtml = FORM_OPEN==='behandlung' ? renderBehandlungForm() : '';
  let list='';
  if(behandlungen.length===0 && FORM_OPEN!=='behandlung'){
    list = `<div class="empty"><p>Noch keine Behandlung erfasst.</p></div>`;
  } else {
    list = behandlungen.map(b=>{
      const mittelKurz = b.mittelBasis || b.mittel || '–';
      return `<div class="entry" id="behandlung-${b.id}">
        <div class="entry-top">
          <span class="entry-date">${fmtDate(b.datum)}</span>
          <span class="pill pill-neutral">${escapeHtml(mittelKurz)}</span>
        </div>
        ${b.mittelDetail ? `<div class="hint" style="margin-top:2px;">${escapeHtml(b.mittelDetail)}</div>` : ''}
        <div class="behandlung-facts">
          ${b.art ? `<span class="bfact">🧪 ${escapeHtml(b.art)}</span>` : ''}
          <span class="bfact">⚖️ ${escapeHtml(b.menge||'–')}</span>
          <span class="bfact">⏳ ${b.wartezeit!==undefined && b.wartezeit!=='' ? b.wartezeit+' Tage' : '–'}</span>
          ${b.anwender ? `<span class="bfact">👤 ${escapeHtml(b.anwender)}</span>` : ''}
          ${b.lieferant ? `<span class="bfact">🧾 ${escapeHtml(b.lieferant)}</span>` : ''}
        </div>
        ${b.notiz ? `<div class="entry-body">${escapeHtml(b.notiz)}</div>` : ''}
        <button class="del" data-del-behandlung="${b.id}">Löschen</button>
      </div>`;
    }).join('');
  }

  return `
    <div class="infobox"><b>Dokumentationspflicht:</b> Seit 2022 müssen nach dem Tierarzneimittelgesetz alle Behandlungen (auch freiverkäufliche Mittel wie Ameisen- oder Oxalsäure) im Bestandsbuch festgehalten und mindestens 5 Jahre aufbewahrt werden. Diese Liste kann dir als digitales Bestandsbuch dienen.</div>
    ${formHtml}
    ${list}
    ${FORM_OPEN!=='behandlung' ? `<button class="btn btn-primary btn-block" id="btn-new-behandlung" style="margin-top:10px;">+ Behandlung erfassen</button>` : ''}
  `;
}

function renderBehandlungForm(){
  const d = DRAFT;
  if(d.datum===undefined) d.datum = todayISO();
  return `<div class="panel">
    <h3>Neue Behandlung</h3>
    <label>Datum</label>
    <input type="date" id="f-b-datum" value="${escapeAttr(d.datum)}">

    <label>Medikament</label>
    <select id="f-b-mittel">${medikamentOptions(d.mittel)}</select>

    <label>Genaue Bezeichnung / Produktname (optional)</label>
    <input type="text" id="f-b-mittel-detail" placeholder="z. B. Oxuvar 5,7 %" value="${escapeAttr(d.mittelDetail||'')}">

    <div class="infobox med-info" id="med-empfehlung" style="display:none;"></div>

    <label>Anwendungsart</label>
    <select id="f-b-art"></select>

    <div class="row2">
      <div><label>Menge je Volk</label><input type="text" id="f-b-menge" placeholder="z. B. 30 ml" value="${escapeAttr(d.menge||'')}"></div>
      <div><label>Wartezeit (Tage)</label><input type="number" id="f-b-wartezeit" placeholder="0" value="${escapeAttr(d.wartezeit||'')}"></div>
    </div>

    <label>Anwender/in</label>
    <input type="text" id="f-b-anwender" placeholder="Name der Person" value="${escapeAttr(d.anwender||'')}">

    <label>Lieferant / Beleg (optional)</label>
    <input type="text" id="f-b-lieferant" placeholder="z. B. Apotheke Musterstadt, Rechnungsnr." value="${escapeAttr(d.lieferant||'')}">

    <label>Notiz (optional)</label>

      <button class="btn btn-ghost" id="btn-cancel-behandlung">Abbrechen</button>
      <button class="btn btn-primary" id="btn-save-behandlung">Speichern</button>
    </div>
  </div>`;
}

/* ---------- Utils ---------- */
/* ================= HISTORIE ================= */
function healthLabel(status){
  if(status==='gut') return 'Gut';
  if(status==='beobachten') return 'Beobachten';
  if(status==='kritisch') return 'Kritisch';
  return 'Unbekannt';
}
function collectHistorie(volk){
  const items = [];
  if(volk.erstelltAm) items.push({datum: volk.erstelltAm, text: 'Volk angelegt', typ:'start', tab:'uebersicht', target:'panel-koenigin'});
  if(volk.schwarm){
    const herkunftLabel = volk.schwarm.herkunft==='fremd' ? 'fremder' : 'eigener';
    const einordnungLabel = volk.schwarm.einordnung==='ableger' ? 'als Ableger eingeordnet' : (volk.schwarm.einordnung==='wirtschaftsvolk' ? 'als Wirtschaftsvolk eingeordnet' : '');
    items.push({datum: volk.erstelltAm, text: `Als ${herkunftLabel} Schwarm erfasst${einordnungLabel?' – '+einordnungLabel:''}`, typ:'ableger', tab:'uebersicht', target:'panel-koenigin'});
  }
  if(volk.ableger){
    if(volk.ableger.erstelltAm) items.push({datum: volk.ableger.erstelltAm, text:'Ableger erstellt', typ:'ableger', tab:'uebersicht', target:'panel-ableger'});
    const ent = volk.ableger.entwicklung || {};
    const labelMap = {
      zelleErstellt:'Königinzelle erstellt', zelleVerdeckelt:'Königinzelle verdeckelt',
      geschluepft:'Königin geschlüpft', begattet:'Königin begattet',
      legt:'Königin legt', markiert:'Königin markiert'
    };
    Object.keys(labelMap).forEach(k=>{
      const st = ent[k];
      if(st && st.erledigt && st.datum) items.push({datum:st.datum, text:labelMap[k], typ:'meilenstein', tab:'uebersicht', target:'panel-entwicklung'});
    });
    if(ent.koeniginVerloren && ent.koeniginVerloren.erledigt && ent.koeniginVerloren.datum){
      items.push({datum:ent.koeniginVerloren.datum, text:'Königin verloren gemeldet', typ:'warn', tab:'uebersicht', target:'panel-entwicklung'});
    }
    (volk.ableger.brutwabenLog||[]).forEach(e=>{
      items.push({datum:e.datum, text:'Neue Brutwaben hinzugefügt (Zyklus '+e.zyklus+')', typ:'ableger', tab:'uebersicht', target:'panel-ableger'});
    });
    if(volk.ableger.wirtschaftsvolkSeit){
      items.push({datum:volk.ableger.wirtschaftsvolkSeit, text:'Zum Wirtschaftsvolk erklärt', typ:'wechsel', tab:'uebersicht', target:'panel-beute'});
    }
  }
  (volk.koeniginHistory||[]).forEach(h=>{
    if(h.ausgetauschtAm) items.push({datum:h.ausgetauschtAm, text:'Königin ausgetauscht'+(h.name?' ('+h.name+')':''), typ:'koenigin', tab:'uebersicht', target:'panel-koenigin'});
  });
  DATA.kontrollen.filter(k=>k.volkId===volk.id).forEach(k=>{
    let text = 'Kontrolle: '+healthLabel(k.gesundheit);
    if(k.brutbild) text += ', Brutbild '+k.brutbild;
    items.push({datum:k.datum, text, typ:'kontrolle', tab:'kontrollen', target:'kontrolle-'+k.id});
  });
  DATA.behandlungen.filter(b=>b.volkId===volk.id).forEach(b=>{
    items.push({datum:b.datum, text:'Behandlung: '+(b.mittelBasis||b.mittel), typ:'behandlung', tab:'behandlungen', target:'behandlung-'+b.id});
  });
  DATA.honigernten.filter(h=>h.volkId===volk.id).forEach(h=>{
    items.push({datum:h.datum, text:'Honig geerntet: '+h.kg+' kg'+(h.notiz?' ('+h.notiz+')':''), typ:'honig', tab:'uebersicht', target:'panel-beute'});
  });
  items.sort((a,b)=> (a.datum||'').localeCompare(b.datum||''));
  return items;
}
function renderVolkHistorie(volk){
  const items = collectHistorie(volk);
  if(!items.length) return `<div class="empty"><p>Noch keine Historie vorhanden.</p></div>`;
  return items.map(it=>`<div class="historie-item historie-item-link" data-historie-tab="${it.tab}" data-historie-target="${it.target}">
    <div class="historie-dot historie-dot-${it.typ}"></div>
    <div>
      <div class="historie-date">${fmtDate(it.datum)}</div>
      <div class="historie-text">${escapeHtml(it.text)}</div>
    </div>
    <div class="historie-chev">›</div>
  </div>`).join('');
}

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

  document.querySelectorAll('[data-start-zucht]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const methode = el.getAttribute('data-start-zucht');
      const ziel = ZUCHT_ANZAHL;
      const anzahl = empfohleneAnsatzAnzahl(ziel);
      const kriterien = ZUCHT_KRITERIEN_AKTIV.length ? ZUCHT_KRITERIEN_AKTIV : ZUCHT_KRITERIEN.map(k=>k.key);
      const bewertet = rankeMuttervoelker(kriterien);
      let mutterVolk = bewertet.length ? bewertet[0].volk : waehleMuttervolkOhneRanking();
      const mutterVolkId = mutterVolk ? mutterVolk.id : null;
      const mutterKoeniginId = mutterVolk && mutterVolk.koenigin ? ensureKoeniginQId(mutterVolk.koenigin) : null;

      for(let i=1;i<=anzahl;i++){ koeniginnen.push({id:uid(), qId:uid(), mutterKoeniginId, label:'Königin '+i, status:'aufzucht'}); }

      };

    if(inp) inp.addEventListener('change', async ()=>{
      if(inp.value===''){ d.angenommenAnzahl = null; await saveData(); render(); return; }
      const aufzuchtAktuell = d.koeniginnen.filter(k=>k.status==='aufzucht').length;
      const val = Math.max(0, Math.min(d.anzahl || d.koeniginnen.length, parseInt(inp.value,10)||0));
      if(val < aufzuchtAktuell){
        let entfernen = aufzuchtAktuell - val;
        for(let i=d.koeniginnen.length-1; i>=0 && entfernen>0; i--){
          if(d.koeniginnen[i].status==='aufzucht'){ d.koeniginnen.splice(i,1); entfernen--; }
        }
      } else if(val > aufzuchtAktuell){
        let hinzufuegen = val - aufzuchtAktuell;
        let naechsteNr = d.koeniginnen.length + 1;
        for(let i=0;i<hinzufuegen;i++){ d.koeniginnen.push({id:uid(), label:'Königin '+naechsteNr, status:'aufzucht'}); naechsteNr++; }

      const nummerEl = document.getElementById('f-zk-nummer-'+koeniginId);
      const nummer = nummerEl ? nummerEl.value.trim() : '';
      const durchgang = DATA.zuchtdurchgaenge.find(d=>d.id===durchgangId);

      if(alt.jahr || alt.farbe || alt.herkunft || alt.name){

    showToast('Volk ist jetzt ein Wirtschaftsvolk');
  });

  // Ableger-Rähmchen in der Übersicht bearbeiten
  document.querySelectorAll('[data-raehmchen-live-idx]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const volk = DATA.voelker.find(v=>v.id===VIEW.volkId);
      if(!volk.ableger || !volk.ableger.raehmchen) return;
      const idx = parseInt(btn.getAttribute('data-raehmchen-live-idx'),10);
      const order = ['leer','brut','futter'];
      const cur = volk.ableger.raehmchen[idx] || 'leer';
      volk.ableger.raehmchen[idx] = order[(order.indexOf(cur)+1)%order.length];
      await saveData();
      render();
    });
  });
  const btnRaehmchenAdd = document.getElementById('btn-raehmchen-add');
  if(btnRaehmchenAdd) btnRaehmchenAdd.addEventListener('click', async ()=>{
    const volk = DATA.voelker.find(v=>v.id===VIEW.volkId);
    volk.ableger = volk.ableger || {istAbleger:true, raehmchen:[], entwicklung:{}};
    volk.ableger.raehmchen = volk.ableger.raehmchen || [];
    if(volk.ableger.raehmchen.length >= 20){ showToast('Maximal 20 Rähmchen'); return; }
    volk.ableger.raehmchen.push('leer');
    await saveData();
    render();
  });
  const btnRaehmchenRemove = document.getElementById('btn-raehmchen-remove');
  if(btnRaehmchenRemove) btnRaehmchenRemove.addEventListener('click', async ()=>{
    const volk = DATA.voelker.find(v=>v.id===VIEW.volkId);
    if(!volk.ableger || !volk.ableger.raehmchen || !volk.ableger.raehmchen.length) return;
    volk.ableger.raehmchen.pop();
    await saveData();
    render();
  });

  // Volk-Stammdaten korrigieren
  const btnEditVolkStammdaten = document.getElementById('btn-edit-volk-stammdaten');
  if(btnEditVolkStammdaten) btnEditVolkStammdaten.addEventListener('click', ()=>{ FORM_OPEN='volk-stammdaten'; DRAFT={}; render(); });
  const btnCancelVolkStammdaten = document.getElementById('btn-cancel-volk-stammdaten');
  if(btnCancelVolkStammdaten) btnCancelVolkStammdaten.addEventListener('click', ()=>{ FORM_OPEN=null; DRAFT={}; render(); });
  const btnSaveVolkStammdaten = document.getElementById('btn-save-volk-stammdaten');
  if(btnSaveVolkStammdaten) btnSaveVolkStammdaten.addEventListener('click', async ()=>{
    const volk = DATA.voelker.find(v=>v.id===VIEW.volkId);
    const name = document.getElementById('f-vs-name').value.trim();
    if(!name){ showToast('Bitte einen Namen eingeben'); return; }
    volk.name = name;
    volk.rasse = document.getElementById('f-vs-rasse').value.trim();
    volk.rahmenmass = document.getElementById('f-vs-rahmenmass').value;
    await saveData();
    FORM_OPEN=null; DRAFT={}; render();
    showToast('Volk-Angaben aktualisiert');
  });

  // Volk umstellen (einzeln, aus der Volk-Übersicht)
  const btnOpenVolkUmzug = document.getElementById('btn-open-volk-umzug');
  if(btnOpenVolkUmzug) btnOpenVolkUmzug.addEventListener('click', ()=>{ FORM_OPEN='volk-umzug'; UMZUG_ZIEL=''; DRAFT={}; render(); });
  const btnCancelVolkUmzug = document.getElementById('btn-cancel-volk-umzug');
  if(btnCancelVolkUmzug) btnCancelVolkUmzug.addEventListener('click', ()=>{ FORM_OPEN=null; UMZUG_ZIEL=''; DRAFT={}; render(); });
  const fVUmzugZiel = document.getElementById('f-vumzug-ziel');
  if(fVUmzugZiel) fVUmzugZiel.addEventListener('change', ()=>{ UMZUG_ZIEL = fVUmzugZiel.value; render(); });
  const btnSaveVolkUmzug = document.getElementById('btn-save-volk-umzug');
  if(btnSaveVolkUmzug) btnSaveVolkUmzug.addEventListener('click', async ()=>{
    if(!UMZUG_ZIEL){ showToast('Bitte einen Zielstand wählen'); return; }
    const volk = DATA.voelker.find(v=>v.id===VIEW.volkId);
    let zielStandId = UMZUG_ZIEL;
    if(UMZUG_ZIEL==='neu'){
      const nameEl = document.getElementById('f-vumzug-neuer-stand');
      const ortEl = document.getElementById('f-vumzug-neuer-stand-ort');
      const lageEl = document.getElementById('f-vumzug-neuer-stand-lage');
      const name = nameEl ? nameEl.value.trim() : '';
      if(!name){ showToast('Bitte einen Namen für den neuen Stand eingeben'); return; }
      const neuerStand = {id:uid(), name, ort: ortEl?ortEl.value.trim():'', lage: lageEl?lageEl.value:''};
      DATA.staende.push(neuerStand);
      zielStandId = neuerStand.id;
    }
    volk.standId = zielStandId;
    await saveData();
    FORM_OPEN=null; UMZUG_ZIEL=''; DRAFT={};
    render();
    showToast('Volk umgestellt');
  });

  // Völker umstellen (Bulk, aus Meine Bienen)
  const btnOpenUmzug = document.getElementById('btn-open-umzug');
  if(btnOpenUmzug) btnOpenUmzug.addEventListener('click', ()=>{ UMZUG_SELECTED=new Set(); UMZUG_ZIEL=''; DRAFT={}; nav({name:'umzug'}); });

  // Honig-Ranking
  const btnOpenHonigRanking = document.getElementById('btn-open-honig-ranking');
  if(btnOpenHonigRanking) btnOpenHonigRanking.addEventListener('click', ()=> nav({name:'honig-ranking'}));
  document.querySelectorAll('[data-open-volk-ranking]').forEach(el=>{
    el.addEventListener('click', ()=> nav({name:'volk', volkId: el.getAttribute('data-open-volk-ranking'), volkTab:'uebersicht'}));
  });
  document.querySelectorAll('[data-umzug-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-umzug-toggle');
      if(UMZUG_SELECTED.has(id)) UMZUG_SELECTED.delete(id); else UMZUG_SELECTED.add(id);
      render();
    });
  });
  const fUmzugZiel = document.getElementById('f-umzug-ziel');
  if(fUmzugZiel) fUmzugZiel.addEventListener('change', ()=>{ UMZUG_ZIEL = fUmzugZiel.value; render(); });
  const btnUmzugVerschieben = document.getElementById('btn-umzug-verschieben');
  if(btnUmzugVerschieben) btnUmzugVerschieben.addEventListener('click', async ()=>{
    if(!UMZUG_ZIEL || !UMZUG_SELECTED.size) return;
    let zielStandId = UMZUG_ZIEL;
    if(UMZUG_ZIEL==='neu'){
      const nameEl = document.getElementById('f-umzug-neuer-stand');
      const ortEl = document.getElementById('f-umzug-neuer-stand-ort');
      const lageEl = document.getElementById('f-umzug-neuer-stand-lage');
      const name = nameEl ? nameEl.value.trim() : '';
      if(!name){ showToast('Bitte einen Namen für den neuen Stand eingeben'); return; }
      const neuerStand = {id:uid(), name, ort: ortEl?ortEl.value.trim():'', lage: lageEl?lageEl.value:''};
      DATA.staende.push(neuerStand);
      zielStandId = neuerStand.id;
    }
    DATA.voelker.forEach(v=>{ if(UMZUG_SELECTED.has(v.id)) v.standId = zielStandId; });
    await saveData();
    const anzahl = UMZUG_SELECTED.size;
    UMZUG_SELECTED = new Set(); UMZUG_ZIEL=''; DRAFT={};
    nav({name:'home'});
    showToast(anzahl+' '+(anzahl===1?'Volk':'Völker')+' verschoben');
  });

  // QR-Codes: Scan-Button, Druck-Buttons, Scan-/Auswahl-Modal
  const btnQrScanOpen = document.getElementById('btn-qr-scan-open');
  if(btnQrScanOpen) btnQrScanOpen.addEventListener('click', ()=>{ QR_MODAL={type:'scan'}; render(); });

  const btnQrDruckAlle = document.getElementById('btn-qr-druck-alle');
  if(btnQrDruckAlle) btnQrDruckAlle.addEventListener('click', ()=> nav({name:'qrdruck', qrVolkIds:null}));

  document.querySelectorAll('[data-qr-print-volk]').forEach(el=>{
    el.addEventListener('click', ()=> nav({name:'qrdruck', qrVolkIds:[el.getAttribute('data-qr-print-volk')]}));
  });

  const btnQrPrintNow = document.getElementById('btn-qr-print-now');
  if(btnQrPrintNow) btnQrPrintNow.addEventListener('click', ()=> window.print());

  const btnQrScanClose = document.getElementById('btn-qr-scan-close');
  if(btnQrScanClose) btnQrScanClose.addEventListener('click', ()=>{ stopQrScanner(); QR_MODAL=null; render(); });

  const btnQrManual = document.getElementById('btn-qr-manual');
  if(btnQrManual) btnQrManual.addEventListener('click', ()=>{ stopQrScanner(); QR_MODAL={type:'manual'}; render(); });

  const btnQrRescan = document.getElementById('btn-qr-rescan');
  if(btnQrRescan) btnQrRescan.addEventListener('click', ()=>{ QR_MODAL={type:'scan'}; render(); });

  const btnQrCancel = document.getElementById('btn-qr-cancel');
  if(btnQrCancel) btnQrCancel.addEventListener('click', ()=>{ QR_MODAL=null; render(); });

  document.querySelectorAll('[data-qr-manual-pick]').forEach(el=>{
    el.addEventListener('click', ()=>{ QR_MODAL={type:'found', volkId: el.getAttribute('data-qr-manual-pick')}; render(); });
  });

  const btnQrOpenVolk = document.getElementById('btn-qr-open-volk');
  if(btnQrOpenVolk) btnQrOpenVolk.addEventListener('click', ()=>{
    const volkId = QR_MODAL.volkId; QR_MODAL=null;
    nav({name:'volk', volkId, volkTab:'uebersicht'});
  });
  const btnQrOpenKontrolle = document.getElementById('btn-qr-open-kontrolle');
  if(btnQrOpenKontrolle) btnQrOpenKontrolle.addEventListener('click', ()=>{
    const volkId = QR_MODAL.volkId; QR_MODAL=null;
    VIEW = Object.assign({}, VIEW, {name:'volk', volkId, volkTab:'kontrollen'});
    FORM_OPEN='kontrolle'; DRAFT={}; KRIT_INFO_OPEN={};
    render(); window.scrollTo(0,0);
  });
  const btnQrOpenBehandlung = document.getElementById('btn-qr-open-behandlung');
  if(btnQrOpenBehandlung) btnQrOpenBehandlung.addEventListener('click', ()=>{
    const volkId = QR_MODAL.volkId; QR_MODAL=null;
    VIEW = Object.assign({}, VIEW, {name:'volk', volkId, volkTab:'behandlungen'});
    FORM_OPEN='behandlung'; DRAFT={};
    render(); window.scrollTo(0,0);
  });

  if(QR_MODAL && QR_MODAL.type==='scan' && !QR_CAMERA_STREAM && !QR_STARTING){
    QR_STARTING = true;
    startQrScanner().finally(()=>{ QR_STARTING = false; });
  }
}

function bindHexGroups(){
  ['sanftmut','wabensitz','volksstaerke','schwarmneigung','varroa'].forEach(id=>{
    document.querySelectorAll(`[data-hexgroup="${id}"] .hexbtn`).forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const val = parseInt(btn.getAttribute('data-val'),10);
        DRAFT[id] = val;
        renderHexGroup(id);
      });
    });
  });
}

/* ---------- Init ---------- */
(async function init(){
  await loadData();
  render();
})();
</script>
</body>
</html>
